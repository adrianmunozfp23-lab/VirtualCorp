---
- name: Crear el directori local de secrets amb permisos restrictius
  ansible.builtin.file:
    path: "{{ wg_vpn_dir }}"
    state: directory
    mode: "0700"

- name: Generar la clau privada de cada client si no existeix
  ansible.builtin.shell: "umask 077 && wg genkey > '{{ wg_vpn_dir }}/{{ item.name }}.key'"
  args:
    creates: "{{ wg_vpn_dir }}/{{ item.name }}.key"
  loop: "{{ wg_clients }}"
  no_log: true

- name: Llegir les claus privades dels clients
  ansible.builtin.slurp:
    src: "{{ wg_vpn_dir }}/{{ item.name }}.key"
  register: wg_client_private_raw
  loop: "{{ wg_clients }}"
  no_log: true

- name: Derivar les claus públiques dels clients
  ansible.builtin.command:
    argv: [wg, pubkey]
    stdin: "{{ item.content | b64decode }}"
  register: wg_client_public_raw
  loop: "{{ wg_client_private_raw.results }}"
  changed_when: false
  no_log: true

- name: Desar les claus públiques (no secretes) com a fet
  ansible.builtin.set_fact:
    wg_client_public_keys: "{{ wg_client_public_keys | default({}) | combine({wg_clients[idx].name: item.stdout | trim}) }}"
  loop: "{{ wg_client_public_raw.results }}"
  loop_control:
    index_var: idx
  no_log: true
